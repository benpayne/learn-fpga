<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Retro-Active — A community ecosystem for retro computing">
  <!--
    og-default.svg — 1200x630 Open Graph preview image.
    Theme: CRT terminal.
      bg     #0a0e12   dark charcoal
      text   #d4e4d2   off-white (subtitle)
      green  #7fff7f   phosphor (heading)
      amber  #ffb000   prompt / accent
      muted  #5a6f5a   dim scanlines / border
    Note: Many Open Graph crawlers (Facebook, LinkedIn) prefer raster formats.
    For production, convert to PNG (e.g. with rsvg-convert or sharp).
  -->
  <defs>
    <!-- Scanline pattern: thin muted horizontal lines -->
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="4" fill="#0a0e12"/>
      <rect x="0" y="2" width="4" height="1" fill="#11181d"/>
    </pattern>
    <!-- Subtle vignette / glow around the heading -->
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7fff7f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7fff7f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0e12"/>
  <rect width="1200" height="630" fill="url(#scanlines)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#5a6f5a" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#5a6f5a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Corner terminal prompt -->
  <g font-family="'IBM Plex Mono', 'JetBrains Mono', 'Courier New', monospace" font-weight="700">
    <text x="60" y="90" font-size="40" fill="#ffb000">&gt;_</text>
  </g>

  <!-- Main heading -->
  <g font-family="'IBM Plex Mono', 'JetBrains Mono', 'Courier New', monospace" text-anchor="middle">
    <text x="600" y="310" font-size="120" font-weight="700" fill="#7fff7f" letter-spacing="-2">
      Retro-Active
    </text>
  </g>

  <!-- Subtitle -->
  <g font-family="'IBM Plex Mono', 'JetBrains Mono', 'Courier New', monospace" text-anchor="middle">
    <text x="600" y="390" font-size="36" font-weight="400" fill="#d4e4d2">
      A community ecosystem for retro computing
    </text>
  </g>

  <!-- Bottom tagline / URL -->
  <g font-family="'IBM Plex Mono', 'JetBrains Mono', 'Courier New', monospace" text-anchor="middle">
    <text x="600" y="500" font-size="22" font-weight="400" fill="#5a6f5a" letter-spacing="2">
      BUILD  ·  SHARE  ·  RUN  ·  CONNECT
    </text>
    <text x="600" y="555" font-size="20" font-weight="400" fill="#ffb000" letter-spacing="1">
      benpayne.github.io/learn-fpga
    </text>
  </g>

  <!-- Blinking cursor-like block near heading -->
  <rect x="1050" y="265" width="20" height="60" fill="#7fff7f" opacity="0.85"/>
</svg>
