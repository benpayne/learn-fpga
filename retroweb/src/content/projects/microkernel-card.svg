<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'IBM Plex Mono', ui-monospace, monospace" role="img" aria-label="Specification card for the Microkernel project.">
  <defs>
    <style>
      .bg { fill: #0a0e12; }
      .frame { fill: #101419; stroke: #7fff7f; stroke-width: 2; rx: 6; }
      .corner { fill: #7fff7f; }
      .kicker { fill: #5a6f5a; font-size: 13px; letter-spacing: 0.12em; }
      .title { fill: #7fff7f; font-size: 38px; font-weight: 700; }
      .sub { fill: #d4e4d2; font-size: 16px; }
      .feat { fill: #d4e4d2; font-size: 14px; }
      .bullet { fill: #ffb000; font-size: 14px; }
      .status { fill: #ffb000; font-size: 12px; font-weight: 700; letter-spacing: 0.15em; }
      .status-frame { fill: none; stroke: #ffb000; stroke-width: 1; rx: 3; }
      .deco { fill: #7fff7f; opacity: 0.10; }
    </style>
  </defs>

  <rect class="bg" width="800" height="500"/>

  <rect class="frame" x="20" y="20" width="760" height="460"/>

  <!-- decorative corner brackets -->
  <path d="M 32 50 L 32 32 L 50 32" stroke="#7fff7f" stroke-width="2" fill="none"/>
  <path d="M 768 32 L 750 32 L 768 32 L 768 50" stroke="#7fff7f" stroke-width="2" fill="none"/>
  <path d="M 32 450 L 32 468 L 50 468" stroke="#7fff7f" stroke-width="2" fill="none"/>
  <path d="M 768 468 L 750 468 L 768 468 L 768 450" stroke="#7fff7f" stroke-width="2" fill="none"/>

  <!-- kicker / category -->
  <text x="60" y="80" class="kicker">SOFTWARE / Kernel</text>

  <!-- title -->
  <text x="60" y="140" class="title">Microkernel</text>

  <!-- subtitle / one-liner -->
  <text x="60" y="180" class="sub">Small core: scheduler, IPC, memory. Drivers and FS run as user-space services.</text>

  <!-- feature bullets -->
  <text x="78" y="250" class="bullet">▸</text>
  <text x="100" y="250" class="feat">Synchronous IPC (send / receive / reply)</text>
  <text x="78" y="280" class="bullet">▸</text>
  <text x="100" y="280" class="feat">Round-robin or priority scheduler</text>
  <text x="78" y="310" class="bullet">▸</text>
  <text x="100" y="310" class="feat">16-bit slot of address space per service</text>
  <text x="78" y="340" class="bullet">▸</text>
  <text x="100" y="340" class="feat">Same source on 6502 (constrained) and 68k+</text>

  <!-- status badge -->
  <rect class="status-frame" x="600" y="430" width="160" height="32"/>
  <text x="680" y="451" text-anchor="middle" class="status">DESIGN</text>

  <!-- decorative motif -->
  <g transform="translate(540,240)" opacity="0.5" stroke="#7fff7f" stroke-width="1.4" fill="none">
            <rect x="0" y="0" width="180" height="120"/>
            <rect x="20" y="20" width="140" height="80"/>
            <rect x="40" y="40" width="100" height="40"/>
            <text x="90" y="65" font-size="10" text-anchor="middle" fill="#7fff7f">μKERNEL</text>
            <text x="90" y="93" font-size="9" text-anchor="middle" fill="#7fff7f" opacity="0.8">SERVICES</text>
            <text x="90" y="113" font-size="9" text-anchor="middle" fill="#7fff7f" opacity="0.8">USERLAND</text>
          </g>
</svg>
