<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'IBM Plex Mono', ui-monospace, monospace" role="img" aria-label="Specification card for the Driver Library project.">
  <defs>
    <style>
      .bg { fill: #0a0e12; }
      .frame { fill: #101419; stroke: #7fff7f; stroke-width: 2; rx: 6; }
      .corner { fill: #7fff7f; }
      .kicker { fill: #5a6f5a; font-size: 13px; letter-spacing: 0.12em; }
      .title { fill: #7fff7f; font-size: 38px; font-weight: 700; }
      .sub { fill: #d4e4d2; font-size: 16px; }
      .feat { fill: #d4e4d2; font-size: 14px; }
      .bullet { fill: #ffb000; font-size: 14px; }
      .status { fill: #ffb000; font-size: 12px; font-weight: 700; letter-spacing: 0.15em; }
      .status-frame { fill: none; stroke: #ffb000; stroke-width: 1; rx: 3; }
      .deco { fill: #7fff7f; opacity: 0.10; }
    </style>
  </defs>

  <rect class="bg" width="800" height="500"/>

  <rect class="frame" x="20" y="20" width="760" height="460"/>

  <!-- decorative corner brackets -->
  <path d="M 32 50 L 32 32 L 50 32" stroke="#7fff7f" stroke-width="2" fill="none"/>
  <path d="M 768 32 L 750 32 L 768 32 L 768 50" stroke="#7fff7f" stroke-width="2" fill="none"/>
  <path d="M 32 450 L 32 468 L 50 468" stroke="#7fff7f" stroke-width="2" fill="none"/>
  <path d="M 768 468 L 750 468 L 768 468 L 768 450" stroke="#7fff7f" stroke-width="2" fill="none"/>

  <!-- kicker / category -->
  <text x="60" y="80" class="kicker">SOFTWARE / Library</text>

  <!-- title -->
  <text x="60" y="140" class="title">Driver Library</text>

  <!-- subtitle / one-liner -->
  <text x="60" y="180" class="sub">One C source per card type. Compiles against any host CPU through GCC. Ecosystem connective tissue.</text>

  <!-- feature bullets -->
  <text x="78" y="250" class="bullet">▸</text>
  <text x="100" y="250" class="feat">Open / read / write / ioctl-like API</text>
  <text x="78" y="280" class="bullet">▸</text>
  <text x="100" y="280" class="feat">Drivers register by card type ID</text>
  <text x="78" y="310" class="bullet">▸</text>
  <text x="100" y="310" class="feat">Same source builds on 6502, 68k, 8086</text>
  <text x="78" y="340" class="bullet">▸</text>
  <text x="100" y="340" class="feat">Critical for cross-host card portability</text>

  <!-- status badge -->
  <rect class="status-frame" x="600" y="430" width="160" height="32"/>
  <text x="680" y="451" text-anchor="middle" class="status">DESIGN</text>

  <!-- decorative motif -->
  <g transform="translate(540,260)" opacity="0.5" stroke="#7fff7f" stroke-width="1.4" fill="none">
            <rect x="0" y="0" width="120" height="22"/><rect x="4" y="4" width="120" height="22"/><rect x="8" y="8" width="120" height="22"/><rect x="12" y="12" width="120" height="22"/><rect x="16" y="16" width="120" height="22"/>
            <text x="60" y="92" font-size="10" text-anchor="middle" fill="#7fff7f">video • audio • io • net • ...</text>
          </g>
</svg>
