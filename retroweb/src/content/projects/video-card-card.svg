<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'IBM Plex Mono', ui-monospace, monospace" role="img" aria-label="Specification card for the Video Card project.">
  <defs>
    <style>
      .bg { fill: #0a0e12; }
      .frame { fill: #101419; stroke: #ffb000; stroke-width: 2; rx: 6; }
      .corner { fill: #ffb000; }
      .kicker { fill: #5a6f5a; font-size: 13px; letter-spacing: 0.12em; }
      .title { fill: #ffb000; font-size: 38px; font-weight: 700; }
      .sub { fill: #d4e4d2; font-size: 16px; }
      .feat { fill: #d4e4d2; font-size: 14px; }
      .bullet { fill: #7fff7f; font-size: 14px; }
      .status { fill: #7fff7f; font-size: 12px; font-weight: 700; letter-spacing: 0.15em; }
      .status-frame { fill: none; stroke: #7fff7f; stroke-width: 1; rx: 3; }
      .deco { fill: #ffb000; opacity: 0.10; }
    </style>
  </defs>

  <rect class="bg" width="800" height="500"/>

  <rect class="frame" x="20" y="20" width="760" height="460"/>

  <!-- decorative corner brackets -->
  <path d="M 32 50 L 32 32 L 50 32" stroke="#ffb000" stroke-width="2" fill="none"/>
  <path d="M 768 32 L 750 32 L 768 32 L 768 50" stroke="#ffb000" stroke-width="2" fill="none"/>
  <path d="M 32 450 L 32 468 L 50 468" stroke="#ffb000" stroke-width="2" fill="none"/>
  <path d="M 768 468 L 750 468 L 768 468 L 768 450" stroke="#ffb000" stroke-width="2" fill="none"/>

  <!-- kicker / category -->
  <text x="60" y="80" class="kicker">HARDWARE / Peripheral Card</text>

  <!-- title -->
  <text x="60" y="140" class="title">Video Card</text>

  <!-- subtitle / one-liner -->
  <text x="60" y="180" class="sub">HDMI + optional VGA. Text and bitmap modes, palette + character ROM on the card.</text>

  <!-- feature bullets -->
  <text x="78" y="250" class="bullet">▸</text>
  <text x="100" y="250" class="feat">Text mode: 80×30 with 16-colour CGA palette</text>
  <text x="78" y="280" class="bullet">▸</text>
  <text x="100" y="280" class="feat">Bitmap modes: 1/2/4 bpp, 32 KB VRAM</text>
  <text x="78" y="310" class="bullet">▸</text>
  <text x="100" y="310" class="feat">HDMI digital out via TMDS serializer</text>
  <text x="78" y="340" class="bullet">▸</text>
  <text x="100" y="340" class="feat">Per-character attributes in 16-bit cells</text>

  <!-- status badge -->
  <rect class="status-frame" x="600" y="430" width="160" height="32"/>
  <text x="680" y="451" text-anchor="middle" class="status">DESIGN</text>

  <!-- decorative motif -->
  <g transform="translate(540,250)" opacity="0.5">
            <rect x="0" y="0" width="160" height="100" fill="none" stroke="#ffb000" stroke-width="1.4"/>
            <g fill="#ffb000">
              <rect x="4" y="4" width="12" height="8"/><rect x="52" y="4" width="12" height="8"/><rect x="100" y="4" width="12" height="8"/><rect x="36" y="16" width="12" height="8"/><rect x="84" y="16" width="12" height="8"/><rect x="132" y="16" width="12" height="8"/><rect x="20" y="28" width="12" height="8"/><rect x="68" y="28" width="12" height="8"/><rect x="116" y="28" width="12" height="8"/><rect x="4" y="40" width="12" height="8"/><rect x="52" y="40" width="12" height="8"/><rect x="100" y="40" width="12" height="8"/><rect x="36" y="52" width="12" height="8"/><rect x="84" y="52" width="12" height="8"/><rect x="132" y="52" width="12" height="8"/><rect x="20" y="64" width="12" height="8"/><rect x="68" y="64" width="12" height="8"/><rect x="116" y="64" width="12" height="8"/><rect x="4" y="76" width="12" height="8"/><rect x="52" y="76" width="12" height="8"/><rect x="100" y="76" width="12" height="8"/>
            </g>
          </g>
</svg>
